@if (items().children && items().children!.length > 0) {
    <li class="rounded-lg font-bold">
        <details class="group">
            <summary class="flex items-center gap-2 cursor-pointer list-none pr-3 after:ml-auto after:shrink-0 [&::-webkit-details-marker]:hidden"
                [class.text-sm]="level() >= 1" [class.text-xs]="level() >= 2" [class.font-semibold]="level() >= 1"
                [class.font-normal]="level() >= 2">
                @if (items().icono && level() === 0) {
                <app-icons [name]="items().icono" [klass]="'h-4.5 w-4.5'" [strokeWidth]="2" />
                }
                {{ items().nomMenu }}
            </summary>

            <ul class="border-l border-violet-400/20" [style.padding-left.px]="12">
                @for (child of items().children; track child.codMenu) {
                <app-sidebarmenu [items]="child" [level]="level() + 1" />
                }
            </ul>
        </details>
    </li>
} @else {
    <li routerLinkActive="lx-active text-white" [routerLink]="routeSegments()" [routerLinkActiveOptions]="{ exact: false }"
        class="rounded-lg py-1 text-violet-100 w-full" [class.text-sm]="level() >= 1" [class.text-xs]="level() >= 2"
        [class.font-bold]="level() === 0" [class.font-semibold]="level() === 1" [class.font-normal]="level() >= 2">
        <a class="flex items-center gap-2 w-full"> @if (items().icono &&
            level() === 0) {
            <app-icons [name]="items().icono" [klass]="'h-4.5 w-4.5'" [strokeWidth]="2" />
            }
            {{ items().nomMenu }}
        </a>
    </li>
}
