<div class="mb-2 flex items-center gap-2.5">
    <span class="flex-1 text-xs font-semibold text-[var(--text)]">Procesando documentos</span>
    @if (progresoDisponible()) {
    <span class="text-xs font-bold tabular-nums text-[var(--navy)]">{{ progreso() }}%</span>
    }
</div>

<div class="h-2 w-full overflow-hidden rounded-full bg-[var(--navy-soft)]" role="progressbar"
    aria-label="Procesamiento de documentos" aria-valuemin="0" aria-valuemax="100"
    [attr.aria-valuenow]="progresoDisponible() ? progreso() : null"
    [attr.aria-valuetext]="progresoDisponible() ? null : 'Procesando'">
    <div class="h-full rounded-full bg-[var(--navy)] transition-all duration-200"
        [class.progress-indeterminate]="!progresoDisponible()"
        [style.width.%]="progresoDisponible() ? progreso() : 35">
    </div>
</div>

<div class="mt-2 text-center text-xs text-[var(--text-muted)]" aria-live="polite">
    {{ mensaje() }}
</div>

<div class="mt-3 flex justify-center">
    <button type="button" class="btn btn-outline btn-sm" (click)="cancelar.emit()">
        Cancelar procesamiento
    </button>
</div>
