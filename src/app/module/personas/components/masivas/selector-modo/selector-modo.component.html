<div class="inline-flex w-full max-w-[360px] rounded-[10px] border border-[var(--border)] bg-[var(--surface-muted)] p-1"
    role="tablist" aria-label="Forma de ingresar documentos">

    <button type="button" role="tab"
        class="flex flex-1 items-center justify-center gap-1.5 rounded-lg px-3 py-2 text-xs font-semibold transition"
        [ngClass]="modo() === 'pegar' ? claseActiva : claseInactiva"
        [attr.aria-selected]="modo() === 'pegar'" [disabled]="deshabilitado()"
        (click)="cambiar.emit('pegar')">
        <svg class="size-[15px]" aria-hidden="true" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="8" y="3" width="8" height="4" rx="1" />
            <path d="M16 5h2a2 2 0 012 2v12a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2h2" />
        </svg>
        Pegar documentos
    </button>

    <button type="button" role="tab"
        class="flex flex-1 items-center justify-center gap-1.5 rounded-lg px-3 py-2 text-xs font-semibold transition"
        [ngClass]="modo() === 'archivo' ? claseActiva : claseInactiva"
        [attr.aria-selected]="modo() === 'archivo'" [disabled]="deshabilitado()"
        (click)="cambiar.emit('archivo')">
        <svg class="size-[15px]" aria-hidden="true" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5" />
            <path d="M4 14v4a2 2 0 002 2h12a2 2 0 002-2v-4" />
        </svg>
        Subir archivo
    </button>
</div>
