<div class="flex flex-wrap items-start justify-between gap-3.5">

    <div class="flex min-w-0 items-start gap-3">
        <div class="grid size-[42px] shrink-0 place-items-center rounded-[11px] max-[600px]:size-9"
            [class]="claseIcono()">
            <ng-content select="[icono]" />
        </div>

        <div class="min-w-0">
            <h2 [id]="tituloId()"
                class="m-0 text-[17px] font-bold leading-6 text-[var(--text)] max-[600px]:text-[15px]">
                {{ titulo() }}
            </h2>
            @if (descripcion()) {
            <p class="mt-2 mb-0 text-[13px] leading-6 text-[var(--text-muted)]">
                {{ descripcion() }}
            </p>
            }
        </div>
    </div>

    <ng-content />
</div>
