<div class="flex min-w-0 items-center gap-3 rounded-[10px] border border-[var(--border)] bg-[var(--surface-muted)] p-3.5">

    <div class="relative grid size-11 shrink-0 place-items-center rounded-lg bg-green-50 text-green-700">
        <svg class="size-6" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
            <path d="M14 2v6h6M8 13h8M8 17h8" />
        </svg>
        <span class="absolute -right-1 -bottom-1 rounded bg-green-700 px-1 py-0.5 text-[8px] font-extrabold text-white">
            {{ extension() }}
        </span>
    </div>

    <div class="min-w-0 flex-1">
        <div class="truncate text-[13px] font-semibold text-[var(--text)]" [title]="archivo().name">
            {{ archivo().name }}
        </div>

        <div class="mt-1 flex flex-wrap gap-1.5 text-xs text-[var(--text-muted)]">
            <span>{{ archivo().size | appFileSizePipe }}</span>
            <span aria-hidden="true">·</span>
            @if (lineas() !== null) {
            <span>{{ lineas() }} {{ lineas() === 1 ? 'línea detectada' : 'líneas detectadas' }}</span>
            } @else {
            <span>Calculando...</span>
            }
        </div>
    </div>

    @if (lineas() !== null) {
    <span class="flex items-center gap-1 text-[11px] font-semibold text-green-700 max-[600px]:hidden">
        <svg class="size-[15px]" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12l4 4L19 6" />
        </svg>
        Archivo listo
    </span>
    }

    <button type="button"
        class="btn btn-ghost btn-sm btn-square text-[var(--text-muted)] hover:bg-[var(--danger-soft)] hover:text-[var(--danger)]"
        aria-label="Quitar archivo" [disabled]="deshabilitado()" (click)="quitar.emit()">
        <svg class="size-[18px]" aria-hidden="true" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M8 6V4h8v2m-10 0l1 14h10l1-14M10 11v5m4-5v5" />
        </svg>
    </button>
</div>
