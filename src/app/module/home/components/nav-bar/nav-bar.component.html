<!-- TOP NAVBAR -->
<div class="navbar shadow-sm px-6 sticky top-0 z-30 gap-2 bg-[#f6f5fb]">
    <div class="flex-none lg:hidden">
        <label for="lx-drawer" aria-label="abrir menú" class="btn btn-square btn-ghost">
            <app-icons name="hamburges" [klass]="'h-6 w-6'" [strokeWidth]="2" />
        </label>
    </div>
    <div class="flex-1 min-w-0">
        <img src="/images/image.png" alt="Informa Perú" class="block h-12 w-auto max-w-full object-contain" />
    </div>
    <div class="flex-none flex items-center gap-1 sm:gap-2">
        <!-- <button type="button" class="btn btn-ghost btn-circle" aria-label="Notificaciones">
            <div class="indicator">
                <app-icons name="bell" [klass]="'h-5 w-5 text-gray-500'" [strokeWidth]="1.8" />
                <span class="badge badge-xs border-none indicator-item"></span>
            </div>
        </button> -->
        <div class="user-menu" #userMenu>
        <button class="user-card" type="button" (click)="userMenuOpen.set(!userMenuOpen())"
            [attr.aria-expanded]="userMenuOpen()" aria-controls="user-information" aria-label="Ver datos del usuario">
            <div class="user-avatar" aria-hidden="true">
                <app-icons name="user" klass="h-5 w-5" [strokeWidth]="1.8" />
            </div>
            <div class="user-details">
                <span class="user-name" [title]="authService.user()?.name || authService.user()?.username || 'Sin sesión'">
                    {{ authService.user()?.name || authService.user()?.username || 'Sin sesión' }}
                </span>
                <span class="user-role" [title]="authService.user()?.name_role || 'Sin rol asignado'">
                    {{ authService.user()?.name_role || 'Sin rol asignado' }}
                </span>
            </div>
            <svg class="user-chevron" [class.is-open]="userMenuOpen()" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m6 9 6 6 6-6" />
            </svg>
        </button>
        <section id="user-information" class="user-dropdown" [hidden]="!userMenuOpen()" aria-labelledby="user-information-title">
            <h2 id="user-information-title">Mi cuenta</h2>
            @if (authService.user(); as user) {
                <dl>
                    <div><dt>Nombre</dt><dd>{{ user.name || 'No disponible' }}</dd></div>
                    <div><dt>Usuario</dt><dd>{{ user.username || 'No disponible' }}</dd></div>
                    <div><dt>Rol</dt><dd>{{ user.name_role || 'Sin rol asignado' }}</dd></div>
                </dl>
            } @else {
                <p>No hay una sesi&#243;n activa.</p>
            }
        </section>
        </div>
    </div>
</div>
