<main class="login-shell">
    <section class="login-showcase" aria-label="Portal de Informa Perú">
        <app-carrusel />  
    </section>

    <section class="login-panel card rounded-none border-0 bg-base-100 ">
        <div class="login-content">
            <div class="login-brand-row">
                <app-login-icon />
            </div>
            <div class="login-heading flex justify-center flex-col text-center mb-5">
                <span class="panel-kicker">Portal interno</span>
                <h3>Inicia sesión</h3>
                <div>Accede al portal interno de Informa Perú.</div>
            </div>
            
            <form class="login-form" (ngSubmit)="onSubmit()" [formGroup]="loginForm">
                <div class="field-group form-control">
                    <label class="label" for="UsuarioLogin"><span>Usuario</span></label>
                    <div class="login-input">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg>
                    <input
                        id="UsuarioLogin"
                        class="w-full"
                        type="text"
                        placeholder="Escribe tu usuario"
                        autocomplete="username"
                        formControlName="UsuarioLogin"
                    />
                    </div>
                </div>
                <div class="field-group form-control">
                    <label class="label" for="Clave"><span>Contraseña</span></label>
                    <div class="login-input">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4m-4 5v2"/></svg>
                    <input
                        id="Clave"
                        class="w-full"
                        type="password"
                        placeholder="Escribe tu contraseña"
                        autocomplete="current-password"
                        formControlName="Clave"
                    />
                    </div>
                </div>
                <button
                    class="submit-button btn btn-primary"
                    type="submit"
                    [disabled]="isLoading()"
                >
                    @if (isLoading()) {
                        <span class="loading loading-spinner loading-sm" aria-hidden="true"></span>
                        Validando acceso...
                    } @else {
                        Entrar al Portal
                    }
                </button>
            </form>
            <p class="mt-4 text-center text-sm">
                <a routerLink="/auth/forgot-password" class="text-[var(--brand-blue)] hover:underline">¿Olvidaste tu contraseña?</a>
            </p>
            <div class="login-security">
                <span aria-hidden="true">&#9679;</span> Acceso protegido para personal autorizado
            </div>
        </div>
    </section>
</main>
@if (hasError()) {
    <div
        role="alert"
        class="alert fixed bottom-5 right-5 w-100"
        [class.alert-warning]="repeatMethodUtils.alertType() === 'warning'"
        [class.alert-error]="repeatMethodUtils.alertType() === 'danger'"
        animate.enter="slide-in-right"
        animate.leave="slide-out-right">

        <app-icons [name]="repeatMethodUtils.alertType()" [klass]="'h-6 w-6 shrink-0'" [strokeWidth]="2" />
        <span class="text-[15px]">{{ repeatMethodUtils.errorMessage() || errorMessage() }}</span>
    </div>
}
